<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Preview — California Interracial Race Crime</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Code+Pro:wght@400;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0a0f;
    color: #fff;
    font-family: 'Playfair Display', serif;
  }

  /* Subtle rain/scan-line texture matching the noir site */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        100deg,
        transparent 0,
        transparent 50px,
        rgba(255,255,255,0.012) 50px,
        rgba(255,255,255,0.012) 51px
      );
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 80% 20%, rgba(230,57,70,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 20% 80%, rgba(120,220,255,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  /* Top: brand strip */
  .top-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-family: 'Source Code Pro', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #e63946;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e63946;
    box-shadow: 0 0 12px #e63946;
  }
  .badge {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(230,57,70,0.18);
    border: 1px solid rgba(230,57,70,0.55);
    padding: 7px 14px;
    border-radius: 3px;
  }

  /* Middle: title */
  .title-block {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: -10px;
  }
  .label-row {
    font-family: 'Source Code Pro', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e63946;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .label-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e63946;
    box-shadow: 0 0 10px #e63946;
  }
  .title {
    font-family: 'Playfair Display', serif;
    font-size: 78px;
    font-weight: 900;
    line-height: 0.98;
    letter-spacing: -1px;
    color: #fff;
    max-width: 900px;
  }
  .interracial {
    display: inline-block;
    font-family: 'Saira Stencil One', monospace;
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #e8f4ff;
    text-shadow:
      0 0 12px rgba(120,220,255,0.6),
      0 0 28px rgba(120,220,255,0.4),
      0 0 48px rgba(120,220,255,0.2);
    margin: 0 4px;
    vertical-align: 6px;
  }
  .race-stamp {
    display: inline-block;
    font-family: 'Source Code Pro', monospace;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #fff;
    background: rgba(230,57,70,0.15);
    border: 4px solid rgba(230,57,70,0.85);
    outline: 1px solid rgba(230,57,70,0.4);
    outline-offset: 4px;
    padding: 4px 22px;
    margin: 0 12px;
    transform: rotate(-3deg);
    text-shadow: 0 0 30px rgba(230,57,70,0.5);
    box-shadow: 0 0 50px rgba(230,57,70,0.25);
    vertical-align: 4px;
  }
  .by-numbers {
    font-family: 'Playfair Display', serif;
    font-size: 50px;
    font-weight: 400;
    font-style: italic;
    color: #e63946;
    margin-top: 8px;
  }

  /* Bottom: stats strip */
  .stats {
    display: flex;
    gap: 60px;
    align-items: flex-end;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    letter-spacing: -1px;
  }
  .stat-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .stat-num .accent { color: #e63946; }

  /* Right edge: vertical sources tag */
  .sources-tag {
    position: absolute;
    right: 70px;
    bottom: 60px;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.6);
    text-align: right;
    line-height: 1.5;
  }
  .sources-tag .accent {
    color: #e63946;
    font-style: normal;
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-right: 4px;
  }
</style>
</head>
<body>
  <div class="frame">

    <!-- TOP -->
    <div class="top-strip">
      <div class="brand">
        <span class="brand-dot"></span>
        Don't Shoot the Data
      </div>
      <div class="badge">A Public Records Investigation</div>
    </div>

    <!-- MIDDLE -->
    <div class="title-block">
      <div class="label-row">
        <span class="label-pulse"></span>
        24 Years · 10 Cities · 4 Crimes
      </div>
      <div class="title">
        California
        <span class="interracial">INTERRACIAL</span>
        <span class="race-stamp">RACE</span>
        Crime
        <br>
        <span class="by-numbers">— By the Numbers</span>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="stats">
      <div class="stat">
        <div class="stat-num">24</div>
        <div class="stat-label">Years of CA Data</div>
      </div>
      <div class="stat">
        <div class="stat-num">10</div>
        <div class="stat-label">Cities · Records Requested</div>
      </div>
      <div class="stat">
        <div class="stat-num">4</div>
        <div class="stat-label">Crime Categories</div>
      </div>
    </div>

    <!-- Right-bottom mini tag -->
    <div class="sources-tag">
      <span class="accent">Source:</span> Public Records Requests<br>
      of California's 10 Largest Cities
    </div>

  </div>
</body>
</html>
